name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: pnpm install

      # The emulators the app serves (scripts/retroarch-cores.ts), as the Docker build makes them: without them no game
      # starts. Kept between runs, as they change only with the emulator list or RetroArch's version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cores
        with:
          path: public/cores
          key: cores-${{ hashFiles('scripts/retroarch-cores.ts', 'src/consoles/**', 'src/input/**') }}
      - if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
          node scripts/retroarch-cores.ts
      - run: node --run=setup
      - run: node --run=lint
      - run: test -z "$(gofmt -l server)" || (gofmt -l server && exit 1)
      - run: node --run=test:go
      - run: node --run=test:unit
      - run: node --run=test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30
